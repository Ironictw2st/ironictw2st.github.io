<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Characters | 190 Expanded Wiki</title>
    <link rel="stylesheet" href="styles/tw3k.css">
    <style>
        /* Characters page specific styles */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--bg-card);
            border: 1px solid #252530;
            border-radius: 4px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .filter-group input,
        .filter-group select {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid #303035;
            color: var(--text-primary);
            font-size: 0.9rem;
            min-width: 150px;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--gold-dark);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
        }

        .filters-actions {
            display: flex;
            align-items: flex-end;
        }

        .clear-filters {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid #303035;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .clear-filters:hover:not(:disabled) { border-color: var(--gold-dark); color: var(--gold-light); }
        .clear-filters:disabled { opacity: 0.4; cursor: default; }

        /* Effect picker: chips for chosen effects, then a text box with a grouped dropdown */
        .filters-break { flex-basis: 100%; height: 0; }
        .effect-box { flex: 1; min-width: 280px; position: relative; }
        .effect-field {
            display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem;
            padding: 0.3rem 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid #303035;
            cursor: text;
        }
        .effect-field:focus-within { border-color: var(--gold-dark); }
        .effect-box .effect-field input {
            flex: 1; min-width: 200px;
            padding: 0.2rem 0.3rem;
            border: none; background: transparent;
        }
        .effect-chip {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.15rem 0.3rem 0.15rem 0.55rem;
            font-size: 0.8rem; color: var(--gold-light);
            background: rgba(201,162,39,0.12); border: 1px solid var(--gold-dark);
        }
        .effect-chip button {
            border: none; background: none; color: inherit; cursor: pointer;
            font-size: 0.95rem; line-height: 1; padding: 0 0.2rem;
        }
        .effect-chip button:hover { color: var(--title-cream); }

        .effect-menu {
            position: absolute; z-index: 20; left: 0; right: 0; top: 100%;
            max-height: 340px; overflow-y: auto;
            scrollbar-color: #3a3a44 transparent;
            margin-top: 2px;
            background: var(--bg-card);
            border: 1px solid var(--gold-dark);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .effect-menu[hidden] { display: none; }
        .effect-menu-group {
            position: sticky; top: 0;
            padding: 0.35rem 0.75rem;
            font-family: 'Cinzel', serif; font-size: 0.7rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-secondary); background: #1c1c22;
            border-bottom: 1px solid #252530;
        }
        .effect-option {
            display: flex; justify-content: space-between; gap: 1rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem; color: var(--text-primary);
            cursor: pointer;
        }
        .effect-option .n { color: var(--text-muted); font-size: 0.75rem; white-space: nowrap; }
        .effect-option mark { background: none; color: var(--gold-light); font-weight: 600; }
        .effect-option.active { background: rgba(201,162,39,0.15); }
        .effect-option.any { color: var(--gold-light); border-bottom: 1px solid #252530; }
        .effect-option.none { color: var(--text-muted); }
        .effect-menu-empty { padding: 0.6rem 0.75rem; font-size: 0.85rem; color: var(--text-muted); }

        /* attribute strip on each card */
        .attr-strip {
            display: flex; flex-wrap: wrap; gap: 0.3rem;
            margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid #252530;
        }
        .attr {
            font-size: 0.7rem; padding: 0.1rem 0.4rem;
            border: 1px solid #2b2b33; color: var(--text-secondary);
            background: rgba(255,255,255,0.03); white-space: nowrap;
        }
        .attr b { color: var(--title-cream); font-weight: 600; }
        .attr.negative b { color: #e0a0a0; }
        .attr.sorted { border-color: var(--gold-dark); background: rgba(201,162,39,0.12); }
        .attr.sorted b { color: var(--gold-light); }
        .attr-none { font-size: 0.72rem; color: var(--text-muted); font-style: italic; }

        .effect-hit {
            display: block; margin-top: 0.5rem; font-size: 0.78rem;
            color: #9bc2e8; border-left: 2px solid #3f5a7a; padding-left: 0.5rem;
        }
        .effect-hit + .effect-hit { margin-top: 0.15rem; }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #252530;
        }

        .results-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
        }

        .view-toggle button {
            padding: 0.4rem 0.8rem;
            background: var(--bg-card);
            border: 1px solid #303035;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-toggle button.active {
            background: var(--red-dark);
            border-color: var(--red-primary);
            color: var(--title-cream);
        }

        /* Character grid */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .character-grid.list-view {
            grid-template-columns: 1fr;
        }

        /* Character card */
        .character-card {
            background: var(--bg-card);
            border: 1px solid #202025;
            border-left: 3px solid var(--element-color, var(--gold-dark));
            padding: 1.25rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .character-card:hover {
            background: var(--bg-card-hover);
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        /* Muted TW-style element colors (match character.html) */
        .character-card[data-element="water"]  { --element-color: #4f6f8f; }
        .character-card[data-element="wood"]   { --element-color: #4f7a55; }
        .character-card[data-element="fire"]   { --element-color: #8c3a3a; }
        .character-card[data-element="earth"]  { --element-color: #9a8648; }
        .character-card[data-element="metal"]  { --element-color: #7a6a99; }
        .character-card[data-element="nanman"] { --element-color: #7f8f4a; }
        .character-card[data-element="unknown"] { --element-color: var(--gold-dark); }

        .character-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .character-name {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--title-cream);
            margin: 0;
        }

        .character-name-chinese {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            opacity: 0.8;
        }

        .character-element {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--element-color);
            color: var(--element-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .character-title {
            font-size: 0.9rem;
            color: var(--gold-primary);
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .character-courtesy {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .character-courtesy-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 0.3rem;
        }

        .character-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .character-meta {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #252530;
        }

        .meta-tag {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            background: rgba(201, 162, 39, 0.1);
            border: 1px solid #353530;
            color: var(--text-muted);
        }

        .meta-tag.unique {
            border-color: var(--gold-dark);
            color: var(--gold-light);
        }

        .meta-tag.male {
            border-color: #a84f26;
            color: #a84f26;
        }

        .meta-tag.female {
            border-color: #9966cc;
            color: #cc99ff;
        }

        .meta-tag.birth-year {
            border-color: #4a6fa5;
            color: #8ab4f8;
        }

        /* List view styles */
        .list-view .character-card {
            display: grid;
            grid-template-columns: 250px 180px 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
        }

        .list-view .character-header {
            margin: 0;
        }

        .list-view .character-title,
        .list-view .character-courtesy {
            margin: 0;
        }

        .list-view .character-description {
            -webkit-line-clamp: 1;
        }

        .list-view .character-meta {
            margin: 0;
            padding: 0;
            border: none;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            background: var(--bg-card);
            border: 1px solid #252530;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--title-cream);
        }

        .stat-item .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Element breakdown */
        .element-breakdown {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .element-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid #303035;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .element-btn:hover,
        .element-btn.active {
            border-color: var(--element-color);
            color: var(--element-color);
        }

        .element-btn[data-element="fire"] { --element-color: #c41e3a; }
        .element-btn[data-element="earth"] { --element-color: #b8860b; }
        .element-btn[data-element="water"] { --element-color: #4169e1; }
        .element-btn[data-element="wood"] { --element-color: #228b22; }
        .element-btn[data-element="metal"] { --element-color: #c0c0c0; }
        .element-btn[data-element="nanman"] { --element-color: #7f8f4a; }
        .element-btn[data-element="all"] { --element-color: var(--gold-primary); }

        .element-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--element-color);
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .no-results h3 {
            font-family: 'Cinzel', serif;
            color: var(--title-cream);
            margin-bottom: 1rem;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .filters {
                flex-direction: column;
            }

            .list-view .character-card {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .stats-bar {
                gap: 1rem;
            }

            .stat-item .number {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

    <script src="data/characters.js"></script>
    <script>
        // Helper function to normalize text for searching
        function normalizeText(text) {
            // Convert to lowercase and normalize unicode characters
            return text.toLowerCase()
                .normalize('NFD') // Decompose combined characters
                .replace(/[\u0300-\u036f]/g, '') // Remove diacritical marks
                .replace(/['']/g, "'") // Normalize apostrophes
                .replace(/[""]/g, '"'); // Normalize quotes
        }

        // State
        let currentElement = 'all';
        let currentSearch = '';
        let currentGender = 'all';
        let currentUnique = 'all';
        let currentSort = 'name';
        let isListView = false;
        let currentEquipId = null;    // id of an Equipment-group effect, or null
        // Chosen effects, all of which a character must have. {id} is one exact effect;
        // {text} is "any effect whose label matches this text", e.g. every kind of morale.
        let effectChips = [];
        let effectQuery = '';         // typed but not yet committed; filters live like a text chip

        const ATTRIBUTE_ORDER = ['authority', 'cunning', 'expertise', 'instinct', 'resolve', 'resilience'];
        const ATTRIBUTE_SHORT = {
            authority: 'AUT', cunning: 'CUN', expertise: 'EXP',
            instinct: 'INS', resolve: 'RES', resilience: 'RSL'
        };
        const ELEMENTS = ['fire', 'earth', 'water', 'wood', 'metal', 'nanman'];

        const ALL_EFFECTS = typeof EFFECT_TYPES !== 'undefined' ? EFFECT_TYPES : [];
        const GROUP_ORDER = typeof EFFECT_GROUP_ORDER !== 'undefined' ? EFFECT_GROUP_ORDER : [];
        // Equipment has its own dropdown, so the effect picker only offers the rest
        const PICKABLE_EFFECTS = ALL_EFFECTS.filter(e => e.group !== 'Equipment');
        const EFFECT_BY_LABEL = {};
        ALL_EFFECTS.forEach(e => { EFFECT_BY_LABEL[e.label.toLowerCase()] = e; });

        // Every word typed must appear in the label, in any order: "cavalry morale" finds
        // "Morale for melee cavalry".
        function queryWords(text) {
            return normalizeText(text).split(/\s+/).filter(Boolean);
        }

        function effectsMatching(text) {
            const words = queryWords(text);
            if (!words.length) return [];
            return PICKABLE_EFFECTS.filter(e => {
                const label = normalizeText(e.label);
                return words.every(w => label.includes(w));
            });
        }

        // Each effect filter becomes a set of effect ids; a character passes it with any one of them.
        function activeEffectSets() {
            const sets = effectChips.map(chip => chip.id !== undefined
                ? new Set([chip.id])
                : new Set(effectsMatching(chip.text).map(e => e.id)));
            if (effectQuery.trim()) sets.push(new Set(effectsMatching(effectQuery).map(e => e.id)));
            return sets;
        }

        function populateEquipOptions() {
            const select = document.getElementById('equip-filter');
            ALL_EFFECTS.filter(e => e.group === 'Equipment')
                .sort((a, b) => a.label.localeCompare(b.label))
                .forEach(e => {
                    const o = document.createElement('option');
                    o.value = e.id;
                    o.textContent = `${e.label} (${e.count})`;
                    select.appendChild(o);
                });
        }

        // Every filter lives in the URL, so a search can be shared or bookmarked.
        function applyUrlState() {
            const params = new URLSearchParams(window.location.search);
            const setSelect = (id, value) => {
                const el = document.getElementById(id);
                if (value && el.querySelector(`option[value="${CSS.escape(value)}"]`)) {
                    el.value = value;
                    return true;
                }
                return false;
            };

            currentSearch = params.get('q') || '';
            document.getElementById('search').value = currentSearch;

            const element = params.get('element');
            if (ELEMENTS.includes(element)) {
                currentElement = element;
                document.querySelectorAll('.element-btn').forEach(b =>
                    b.classList.toggle('active', b.dataset.element === element));
            }
            if (setSelect('gender-filter', params.get('gender'))) currentGender = params.get('gender');
            if (setSelect('unique-filter', params.get('type'))) currentUnique = params.get('type');
            if (setSelect('sort-filter', params.get('sort'))) currentSort = params.get('sort');

            const equip = EFFECT_BY_LABEL[(params.get('equip') || '').trim().toLowerCase()];
            if (equip && equip.group === 'Equipment') {
                currentEquipId = equip.id;
                document.getElementById('equip-filter').value = equip.id;
            }

            params.getAll('effect').forEach(label => {
                const e = EFFECT_BY_LABEL[label.trim().toLowerCase()];
                if (e && e.group !== 'Equipment' && !effectChips.some(c => c.id === e.id)) effectChips.push({ id: e.id });
            });
            params.getAll('match').forEach(text => {
                if (text.trim()) effectChips.push({ text: text.trim() });
            });
            renderEffectChips();
        }

        function updateUrlState() {
            const params = new URLSearchParams();
            if (currentSearch.trim()) params.set('q', currentSearch.trim());
            if (currentElement !== 'all') params.set('element', currentElement);
            if (currentGender !== 'all') params.set('gender', currentGender);
            if (currentUnique !== 'all') params.set('type', currentUnique);
            if (currentSort !== 'name') params.set('sort', currentSort);
            if (currentEquipId !== null) params.set('equip', EFFECT_TYPE_BY_ID[currentEquipId].label);
            effectChips.forEach(chip => chip.id !== undefined
                ? params.append('effect', EFFECT_TYPE_BY_ID[chip.id].label)
                : params.append('match', chip.text));
            const qs = params.toString();
            history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
        }

        function hasActiveFilters() {
            return Boolean(currentSearch.trim() || currentElement !== 'all' || currentGender !== 'all'
                || currentUnique !== 'all' || currentEquipId !== null || effectChips.length || effectQuery.trim());
        }

        // Called after any filter changes
        function refresh() {
            updateUrlState();
            renderCharacters();
            document.getElementById('clear-filters').disabled = !hasActiveFilters();
        }

        function clearFilters() {
            currentElement = 'all';
            currentSearch = '';
            currentGender = 'all';
            currentUnique = 'all';
            currentEquipId = null;
            effectChips = [];
            effectQuery = '';
            document.querySelectorAll('.element-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.element === 'all'));
            document.getElementById('search').value = '';
            document.getElementById('gender-filter').value = 'all';
            document.getElementById('unique-filter').value = 'all';
            document.getElementById('equip-filter').value = '';
            document.getElementById('effect-filter').value = '';
            renderEffectChips();
            closeEffectMenu();
            refresh();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            updateElementCounts();
            populateEquipOptions();
            applyUrlState();
            refresh();
            setupEventListeners();
            setupEffectPicker();
            attachCharacterNavigation();
        });

        function updateStats() {
            document.getElementById('stat-total').textContent = CHARACTER_STATS.total;
            document.getElementById('stat-unique').textContent = CHARACTER_STATS.unique;
            document.getElementById('stat-male').textContent = CHARACTER_STATS.male;
            document.getElementById('stat-female').textContent = CHARACTER_STATS.female;
        }

        function updateElementCounts() {
            ELEMENTS.forEach(el => {
                document.getElementById(`count-${el}`).textContent = `(${CHARACTER_STATS.byElement[el]})`;
            });
        }

        function setupEventListeners() {
            // Element buttons
            document.querySelectorAll('.element-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.element-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentElement = btn.dataset.element;
                    refresh();
                });
            });

            // Search. Rebuilding 1,650 cards per keystroke stutters, so wait for a pause in typing.
            let searchTimer = null;
            document.getElementById('search').addEventListener('input', (e) => {
                currentSearch = e.target.value;
                clearTimeout(searchTimer);
                searchTimer = setTimeout(refresh, 150);
            });

            // Gender filter
            document.getElementById('gender-filter').addEventListener('change', (e) => {
                currentGender = e.target.value;
                refresh();
            });

            // Unique filter
            document.getElementById('unique-filter').addEventListener('change', (e) => {
                currentUnique = e.target.value;
                refresh();
            });

            // Sort
            document.getElementById('sort-filter').addEventListener('change', (e) => {
                currentSort = e.target.value;
                refresh();
            });

            // Equipment
            document.getElementById('equip-filter').addEventListener('change', (e) => {
                currentEquipId = e.target.value === '' ? null : Number(e.target.value);
                refresh();
            });

            document.getElementById('clear-filters').addEventListener('click', clearFilters);

            // View toggle
            document.getElementById('grid-view').addEventListener('click', () => {
                isListView = false;
                document.getElementById('grid-view').classList.add('active');
                document.getElementById('list-view').classList.remove('active');
                document.getElementById('character-grid').classList.remove('list-view');
            });

            document.getElementById('list-view').addEventListener('click', () => {
                isListView = true;
                document.getElementById('list-view').classList.add('active');
                document.getElementById('grid-view').classList.remove('active');
                document.getElementById('character-grid').classList.add('list-view');
            });
        }

        // ------------------------------------------------------------------
        // Effect picker
        // ------------------------------------------------------------------
        let menuOptions = [];     // chips offered by the open menu, in display order
        let menuActive = -1;

        function chipLabel(chip) {
            return chip.id !== undefined ? EFFECT_TYPE_BY_ID[chip.id].label : `Any “${chip.text}”`;
        }

        function renderEffectChips() {
            document.getElementById('effect-chips').innerHTML = effectChips.map((chip, i) => `
                <span class="effect-chip">${escapeHtml(chipLabel(chip))}
                    <button type="button" data-remove="${i}" aria-label="Remove ${escapeHtml(chipLabel(chip))}">×</button>
                </span>`).join('');
            document.getElementById('effect-filter').placeholder = effectChips.length
                ? 'Add another effect…'
                : 'Type to find an effect, e.g. income, morale, replenishment';
        }

        function highlight(label, words) {
            // match on the plain label, then escape each piece, so markup in a label can't leak
            if (!words.length) return escapeHtml(label);
            const escaped = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            return label.split(new RegExp(`(${escaped.join('|')})`, 'ig'))
                .map((part, i) => i % 2 ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part))
                .join('');
        }

        function openEffectMenu() {
            const menu = document.getElementById('effect-menu');
            const text = effectQuery.trim();
            const words = queryWords(text);
            const chosen = new Set(effectChips.filter(c => c.id !== undefined).map(c => c.id));

            // With nothing typed, show everything grouped, most common first in each group.
            const matches = (text ? effectsMatching(text) : PICKABLE_EFFECTS).filter(e => !chosen.has(e.id));

            // Count within the characters the other filters already leave, so the menu doesn't
            // offer an effect that would empty the page. The text being typed is left out of it.
            const typed = effectQuery;
            effectQuery = '';
            const pool = filterCharacters();
            effectQuery = typed;
            const countIn = {};
            pool.forEach(c => (c.effects || []).forEach(id => { countIn[id] = (countIn[id] || 0) + 1; }));
            const n = e => countIn[e.id] || 0;
            const narrowed = pool.length < CHARACTER_DATA.length;

            menuOptions = [];
            let html = '';
            if (text && matches.length > 1) {
                html += `<div class="effect-option any" data-i="0" role="option">
                    <span>Any effect matching “${escapeHtml(text)}”</span>
                    <span class="n">${matches.length} effects</span></div>`;
                menuOptions.push({ text });
            }
            GROUP_ORDER.forEach(group => {
                const items = matches.filter(e => e.group === group)
                    .sort((a, b) => n(b) - n(a) || b.count - a.count || a.label.localeCompare(b.label));
                if (!items.length) return;
                html += `<div class="effect-menu-group">${group}</div>`;
                items.forEach(e => {
                    const count = narrowed ? `${n(e)} of ${e.count}` : `${e.count}`;
                    html += `<div class="effect-option${n(e) ? '' : ' none'}" data-i="${menuOptions.length}" role="option">
                        <span>${highlight(e.label, words)}</span>
                        <span class="n">${count} character${e.count === 1 ? '' : 's'}</span></div>`;
                    menuOptions.push({ id: e.id });
                });
            });
            if (!menuOptions.length) {
                html = `<div class="effect-menu-empty">No effect matches “${escapeHtml(text)}”</div>`;
            }

            menu.innerHTML = html;
            menu.hidden = false;
            document.getElementById('effect-filter').setAttribute('aria-expanded', 'true');
            setMenuActive(text ? 0 : -1);
        }

        function closeEffectMenu() {
            document.getElementById('effect-menu').hidden = true;
            document.getElementById('effect-filter').setAttribute('aria-expanded', 'false');
            menuActive = -1;
        }

        function setMenuActive(i) {
            const menu = document.getElementById('effect-menu');
            menu.querySelectorAll('.effect-option.active').forEach(el => el.classList.remove('active'));
            menuActive = menuOptions.length ? Math.max(-1, Math.min(i, menuOptions.length - 1)) : -1;
            if (menuActive < 0) return;
            const el = menu.querySelector(`.effect-option[data-i="${menuActive}"]`);
            el.classList.add('active');
            el.scrollIntoView({ block: 'nearest' });
        }

        function addEffectChip(chip) {
            const dup = effectChips.some(c => chip.id !== undefined ? c.id === chip.id
                : c.text !== undefined && c.text.toLowerCase() === chip.text.toLowerCase());
            if (!dup) effectChips.push(chip);
            effectQuery = '';
            document.getElementById('effect-filter').value = '';
            renderEffectChips();
            closeEffectMenu();
            refresh();
        }

        function setupEffectPicker() {
            const input = document.getElementById('effect-filter');
            const menu = document.getElementById('effect-menu');

            document.getElementById('effect-field').addEventListener('click', (e) => {
                const remove = e.target.closest('[data-remove]');
                if (remove) {
                    effectChips.splice(Number(remove.dataset.remove), 1);
                    renderEffectChips();
                    refresh();
                }
                input.focus();
                if (menu.hidden) openEffectMenu();
            });

            input.addEventListener('focus', openEffectMenu);
            input.addEventListener('blur', closeEffectMenu);
            input.addEventListener('input', () => {
                effectQuery = input.value;
                openEffectMenu();
                refresh();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (menu.hidden) openEffectMenu();
                    setMenuActive(menuActive + (e.key === 'ArrowDown' ? 1 : -1));
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (menuActive >= 0) addEffectChip(menuOptions[menuActive]);
                    else if (effectQuery.trim()) addEffectChip({ text: effectQuery.trim() });
                } else if (e.key === 'Escape') {
                    closeEffectMenu();
                } else if (e.key === 'Backspace' && !input.value && effectChips.length) {
                    effectChips.pop();
                    renderEffectChips();
                    refresh();
                }
            });

            // mousedown, not click, so the input keeps focus and the menu doesn't close first
            menu.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const opt = e.target.closest('.effect-option');
                if (opt) addEffectChip(menuOptions[Number(opt.dataset.i)]);
            });
            menu.addEventListener('mousemove', (e) => {
                const opt = e.target.closest('.effect-option');
                if (opt && Number(opt.dataset.i) !== menuActive) setMenuActive(Number(opt.dataset.i));
            });
        }

        function attachCharacterNavigation() {
            const grid = document.getElementById('character-grid');
            if (!grid) return;

            // Mouse click
            grid.addEventListener('click', (e) => {
                const card = e.target.closest('.character-card');
                if (!card) return;

                const key = card.dataset.key;
                if (!key) return;

                window.location.href = `character.html?key=${encodeURIComponent(key)}`;
            });

            // Keyboard (Enter / Space)
            grid.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter' && e.key !== ' ') return;

                const card = e.target.closest('.character-card');
                if (!card) return;

                e.preventDefault();
                const key = card.dataset.key;
                if (!key) return;

                window.location.href = `character.html?key=${encodeURIComponent(key)}`;
            });
        }

        function filterCharacters() {
            let filtered = [...CHARACTER_DATA];

            // Element filter
            if (currentElement !== 'all') {
                filtered = filtered.filter(c => c.element === currentElement);
            }

            // Search filter - now accent-insensitive
            if (currentSearch) {
                const normalizedSearch = normalizeText(currentSearch);
                
                filtered = filtered.filter(c => {
                    // Normalize all searchable fields
                    const normalizedName = normalizeText(c.display_name);
                    const normalizedNameAlt = normalizeText(c.display_name_alt || '');
                    const normalizedTitle = normalizeText(c.title || '');
                    const normalizedKey = normalizeText(c.name_key);
                    const normalizedForename = normalizeText(c.forename || '');
                    const normalizedFamilyName = normalizeText(c.family_name || '');
                    const normalizedCourtesy = normalizeText(c.courtesy_name || '');
                    
                    // Check if any normalized field contains the normalized search term
                    return normalizedName.includes(normalizedSearch) ||
                           normalizedNameAlt.includes(normalizedSearch) ||
                           normalizedTitle.includes(normalizedSearch) ||
                           normalizedKey.includes(normalizedSearch) ||
                           normalizedForename.includes(normalizedSearch) ||
                           normalizedFamilyName.includes(normalizedSearch) ||
                           normalizedCourtesy.includes(normalizedSearch);
                });
            }

            // Gender filter
            if (currentGender !== 'all') {
                filtered = filtered.filter(c => 
                    currentGender === 'male' ? c.is_male : !c.is_male
                );
            }

            // Unique filter
            if (currentUnique !== 'all') {
                filtered = filtered.filter(c =>
                    currentUnique === 'unique' ? c.is_unique : !c.is_unique
                );
            }

            // Effect filter
            if (currentEquipId !== null) {
                filtered = filtered.filter(c => (c.effects || []).includes(currentEquipId));
            }
            const effectSets = activeEffectSets();
            if (effectSets.length) {
                filtered = filtered.filter(c => {
                    const has = c.effects || [];
                    return effectSets.every(set => has.some(id => set.has(id)));
                });
            }

            // Sort
            const attrSort = currentSort.startsWith('attr:') ? currentSort.slice(5) : null;
            filtered.sort((a, b) => {
                if (attrSort) {
                    const av = (a.attributes || {})[attrSort];
                    const bv = (b.attributes || {})[attrSort];
                    // characters without the attribute sort last rather than as zero
                    if (av === undefined && bv === undefined) return a.display_name.localeCompare(b.display_name);
                    if (av === undefined) return 1;
                    if (bv === undefined) return -1;
                    return bv - av || a.display_name.localeCompare(b.display_name);
                }
                switch (currentSort) {
                    case 'name':
                        return a.display_name.localeCompare(b.display_name);
                    case 'name-desc':
                        return b.display_name.localeCompare(a.display_name);
                    case 'element':
                        return a.element.localeCompare(b.element) || a.display_name.localeCompare(b.display_name);
                    default:
                        return 0;
                }
            });

            return filtered;
        }

        function attrStripHtml(char) {
            const attrs = char.attributes || {};
            const sorted = currentSort.startsWith('attr:') ? currentSort.slice(5) : null;
            const parts = ATTRIBUTE_ORDER
                .filter(a => attrs[a] !== undefined)
                .map(a => `<span class="attr${a === sorted ? ' sorted' : ''}${attrs[a] < 0 ? ' negative' : ''}">`
                    + `${ATTRIBUTE_SHORT[a]} <b>${attrs[a] > 0 ? '+' : ''}${attrs[a]}</b></span>`);
            if (!parts.length) return '<div class="attr-strip"><span class="attr-none">No attribute bonuses</span></div>';
            return `<div class="attr-strip">${parts.join('')}</div>`;
        }

        // Under each card, name the effects that made it match, so a broad "morale" filter
        // says which kind of morale this character actually has.
        function effectHitsHtml(char, effectSets) {
            if (!effectSets.length) return '';
            const shown = new Set();
            (char.effects || []).forEach(id => {
                if (effectSets.some(set => set.has(id))) shown.add(id);
            });
            const labels = [...shown].map(id => EFFECT_TYPE_BY_ID[id].label).sort();
            const extra = labels.length > 4 ? labels.length - 3 : 0;
            return (extra ? labels.slice(0, 3) : labels)
                .map(l => `<span class="effect-hit">${escapeHtml(l)}</span>`).join('')
                + (extra ? `<span class="effect-hit">+${extra} more</span>` : '');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // The tables carry a birth year but no death year, so this is a birth date and an age,
        // not a lifespan. `age_at_start` is null for the 310 characters born after 190, who are
        // simply not on the map when the campaign opens - saying so is the point, since a birth
        // year in the 200s otherwise reads as an error.
        function formatLifespan(char) {
            const b = char.birth_year;
            if (!b) return '';
            const age = char.age_at_start;
            return age === null || age === undefined
                ? `Born ${b} AD · after the campaign starts`
                : `Born ${b} AD · aged ${age} in 190`;
        }


        function renderCharacters() {
            const filtered = filterCharacters();
            const effectSets = activeEffectSets();
            const grid = document.getElementById('character-grid');
            
            // Update count
            document.getElementById('results-count').textContent = 
                `Showing ${filtered.length} of ${CHARACTER_DATA.length} characters`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h3>No characters found</h3>
                        <p>${effectSets.length > 1
                            ? 'No one has all of these effects together. Try removing one.'
                            : 'Try adjusting your filters or search term.'}</p>
                    </div>
                `;
                return;
            }

            // Render cards
            grid.innerHTML = filtered.map(char => `
                <article class="character-card"
                        data-key="${char.key}"
                        data-element="${(char.element || 'unknown').toLowerCase()}"
                        tabindex="0"
                        role="link"
                        aria-label="Open ${char.display_name}">
                    <div class="character-header">
                        <div>
                            <h3 class="character-name">
                                ${escapeHtml(char.display_name)}
                                ${char.display_name_alt ? `<div class="character-name-chinese">${escapeHtml(char.display_name_alt)}</div>` : ''}
                            </h3>
                        </div>
                        <span class="character-element">${char.element}</span>
                    </div>
                    ${char.courtesy_name ? `
                        <p class="character-courtesy">
                            <span class="character-courtesy-label">Courtesy:</span>
                            ${escapeHtml(char.courtesy_name)}
                            ${char.courtesy_name_alt ? ` ${escapeHtml(char.courtesy_name_alt)}` : ''}
                        </p>
                    ` : ''}
                    ${char.title ? `<p class="character-title">${escapeHtml(char.title)}</p>` : ''}
                    ${char.description ? `<p class="character-description">${escapeHtml(char.description)}</p>` : ''}
                    ${effectHitsHtml(char, effectSets)}
                    ${attrStripHtml(char)}
                    <div class="character-meta">
                        ${char.is_unique ? '<span class="meta-tag unique">Unique</span>' : '<span class="meta-tag">Generic</span>'}
                        ${!char.is_male ? '<span class="meta-tag female">Female</span>' : '<span class="meta-tag male">Male</span>'}
                        ${char.birth_year ? `<span class="meta-tag birth-year">${escapeHtml(formatLifespan(char))}</span>` : ''}
                    </div>
                </article>
            `).join('');
        }
    </script>
</body>
</html>
